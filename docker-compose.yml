# Контейнерное окружение Auction System (Lab 4).
#
#   клиент ──:8080──► nginx ──┬──► app1 ─┐
#            (frontend)       └──► app2 ─┴──► db (PostgreSQL, volume pgdata)
#                              (backend: internal, без выхода наружу)
#
# Порядок запуска: db (healthy) → migrate (alembic upgrade head, exit 0)
#                  → app1, app2 (healthy) → nginx.
# Наружу опубликован ТОЛЬКО порт nginx. Порт БД и приложения не публикуются.
# Секреты не хранятся ни здесь, ни в образе: берутся из .env (в .gitignore).
#
# Любые изменения окружения применяются только через `make container-up`,
# который сначала выполняет `make container-check` (п. 14).

name: auctions

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Версия приложения (APP_VERSION) и commit (APP_COMMIT) не задаются здесь:
# они зашиты в образ при сборке, и /version показывает реально запущенный образ.
x-app-env: &app-env
  APP_NAME: ${APP_NAME:-auction-system}
  # Имя окружения: production по умолчанию, staging — из staging.env (Lab 6).
  ENVIRONMENT: ${DEPLOY_ENVIRONMENT:-production}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER не задан}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан (см. .env.example)}@db:5432/${POSTGRES_DB:?POSTGRES_DB не задан}

# Общие параметры экземпляров приложения (app1, app2).
x-app: &app
  image: auctions-app:${APP_VERSION:?APP_VERSION не задан}
  pull_policy: never # образ собирается сервисом migrate из того же Dockerfile
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=16m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  # Запас к --timeout-graceful-shutdown 20 в Dockerfile: по истечении
  # этого времени Docker отправит SIGKILL, поэтому он должен быть больше.
  stop_grace_period: 30s
  expose: ["8000"]
  networks: [backend]
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 20s
  # Обоснование лимитов — docs/CONTAINERS.md, раздел «Ограничения ресурсов».
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M
        pids: 128
      reservations:
        memory: 96M
  logging: *logging

services:
  db:
    image: postgres:17.2-bookworm
    # Процесс PostgreSQL сразу запускается от пользователя postgres (uid 999),
    # entrypoint не стартует от root. Каталог данных в образе принадлежит postgres.
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан (см. .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    # Порт 5432 НЕ публикуется: БД доступна только контейнерам сети backend.
    # Для локальной разработки (make up / make test) порт открывается на
    # 127.0.0.1 отдельным файлом docker-compose.dev.yml.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 128m
    healthcheck:
      # -h 127.0.0.1: во время первичной инициализации PostgreSQL слушает
      # только unix-сокет, поэтому БД станет healthy лишь после полного запуска.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
          pids: 256
        reservations:
          memory: 192M
    logging: *logging

  # Одноразовый сервис миграций: применяется один раз до старта экземпляров,
  # чтобы два экземпляра приложения не мигрировали БД одновременно.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION не задан}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: auctions-app:${APP_VERSION:?APP_VERSION не задан}
    command: ["alembic", "upgrade", "head"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: *app-env
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    labels:
      # Одноразовый процесс: healthcheck не нужен, проверяется код выхода 0.
      ru.auctions.oneshot: "true"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 64
    logging: *logging

  app1:
    <<: *app
    hostname: app1
    environment:
      <<: *app-env
      INSTANCE_ID: app1

  app2:
    <<: *app
    hostname: app2
    environment:
      <<: *app-env
      INSTANCE_ID: app2

  nginx:
    # Официальный образ nginx, работающий без root (uid 101, порт 8080).
    image: nginxinc/nginx-unprivileged:1.27.3-alpine
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Единственный опубликованный порт окружения.
    ports:
      - "${HTTP_PORT:-8080}:8080"
    networks: [frontend, backend]
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64
    logging: *logging

networks:
  # Внешняя сеть: только nginx, через неё публикуется порт 8080.
  frontend:
    driver: bridge
  # Внутренняя сеть: приложение и БД, без маршрута наружу и без публикации портов.
  # gateway_mode isolated (Docker >= 28): у хоста нет адреса в этой сети, поэтому
  # даже с самой ВМ нельзя обратиться к приложению или БД по IP контейнера —
  # только через nginx. Проверяется make container-check.
  backend:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  pgdata:
    # Имя volume можно переопределить (DB_VOLUME) — так БД восстанавливается
    # в новый volume: make container-restore-check.
    name: ${DB_VOLUME:-auctions_pgdata}
