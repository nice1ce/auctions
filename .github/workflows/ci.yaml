# CI Auction System (Lab 5). Стадии и их порядок:
#
#   prepare ─► style ─┬─► tests ───────┐
#                     ├─► migrations ──┤
#                     ├─► backup ──────┤
#                     ├─► security ────┼─► publish (локальный registry; GHCR — только main)
#                     └─► build ─┬─► image-scan ─┤
#                                └─► container ──┘
#
# Каждая стадия вызывает те же make-цели, что и разработчик локально.
# publish запускается, только если успешны ВСЕ обязательные стадии (needs).
# Пароли — только из защищённых секретов (secrets.*), в файлах их нет.
# Изменения этого файла проверяет страж (workflow guard) и владелец кода.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Версия и тег образа из commit SHA
        id: meta
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base=$(sed -n 's/^APP_VERSION=//p' .env.example)
          version="${base}-${HEAD_SHA::7}"
          {
            echo "sha=${HEAD_SHA}"
            echo "version=${version}"
            echo "image=auctions-app:${version}"
          } >> "$GITHUB_OUTPUT"
          echo "Образ: \`auctions-app:${version}\` (commit ${HEAD_SHA})" >> "$GITHUB_STEP_SUMMARY"

  style:
    name: style
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
      - name: make policy (запрет пропуска тестов, снижения порогов)
        run: make policy
      - name: make lint (ruff)
        if: success() || failure()
        run: make lint
      - name: make format-check (black)
        if: success() || failure()
        run: make format-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-style
          path: |
            reports/ruff.xml
            reports/black.diff
          if-no-files-found: ignore

  tests:
    name: tests
    needs: [prepare, style]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.2-bookworm
        env:
          POSTGRES_DB: auction_db
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U auction -d auction_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
      # п. 6: тесты работают только с отдельной БД auction_test (TEST_DATABASE_URL),
      # conftest.py отказывается запускаться, если она совпадает с рабочей.
      - name: make test (unit + интеграционные, покрытие >= 85 %)
        run: make test
      - name: Сводка тестов
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import pathlib, xml.etree.ElementTree as ET
          junit, cov = pathlib.Path("reports/junit.xml"), pathlib.Path("reports/coverage.xml")
          if junit.exists():
              s = ET.parse(junit).getroot()
              s = s if s.tag == "testsuite" else s.find("testsuite")
              print(f"### Тесты: {s.get('tests')} всего, ошибок {s.get('errors')}, "
                    f"падений {s.get('failures')}, пропущено {s.get('skipped')}")
          if cov.exists():
              print(f"Покрытие: {float(ET.parse(cov).getroot().get('line-rate')) * 100:.1f} %")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-tests
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/htmlcov/
          if-no-files-found: ignore

  migrations:
    name: migrations
    needs: [prepare, style]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.2-bookworm
        env:
          POSTGRES_DB: auction_db
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U auction -d auction_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
      # dropdb/createdb той же версии, что и сервер, — внутри контейнера БД
      # (контекст job доступен только на уровне шагов)
      - name: make db-reset (чистая БД -> все миграции)
        env:
          PG_EXEC: docker exec -i ${{ job.services.postgres.id }}
        run: make db-reset
      - name: make migrate-check (upgrade head + сверка схемы с моделями)
        run: make migrate-check
      - name: make migrate-roundtrip (downgrade base -> upgrade head)
        run: make migrate-roundtrip 2>&1 | tee reports-migrations.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-migrations
          path: reports-migrations.log
          if-no-files-found: ignore

  backup:
    name: backup
    needs: [prepare, style]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.2-bookworm
        env:
          POSTGRES_DB: auction_db
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U auction -d auction_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
      - name: make migrate
        run: make migrate
      # pg_dump/psql той же версии, что и сервер, — внутри контейнера БД
      - name: make backup-check (копия -> порча -> восстановление -> сверка)
        env:
          PG_EXEC: docker exec -i ${{ job.services.postgres.id }}
        run: make backup-check 2>&1 | tee backup-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-backup
          path: backup-check.log
          if-no-files-found: ignore

  security:
    name: security
    needs: [prepare, style]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # поиск секретов по всей истории
      - uses: ./.github/actions/setup-project
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
      - name: make sast (bandit)
        run: make sast
      - name: make secrets-scan (gitleaks, вся история git)
        if: success() || failure()
        run: make secrets-scan
      - name: make deps-audit (pip-audit)
        if: success() || failure()
        run: make deps-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-security
          path: |
            reports/bandit.json
            reports/gitleaks.sarif
            reports/pip-audit-*.json
            reports/deps-audit.md
          if-no-files-found: ignore

  build:
    name: build
    needs: [prepare, style]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка образа (кэш слоёв — в кэше GitHub Actions)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ needs.prepare.outputs.image }}
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=auctions-app
          cache-to: type=gha,scope=auctions-app,mode=max
          provenance: false
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  image-scan:
    name: image-scan
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Дата для кэша базы уязвимостей
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-
      - name: make image-scan (Trivy)
        run: make image-scan IMAGE=${{ needs.prepare.outputs.image }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-image-scan
          path: |
            reports/trivy-image.json
            reports/image-scan.md
          if-no-files-found: ignore

  container:
    name: container
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Проверяется ровно тот образ, который собрала стадия build.
      CONTAINER_CHECK_FLAGS: --no-build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          app-version: ${{ needs.prepare.outputs.version }}
          install: "false"
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar" && mkdir -p reports
      - name: make container-check (Dockerfile, Compose, образ)
        run: make container-check 2>&1 | tee reports/container-check.txt
      - name: make container-up (запуск окружения + проверка стенда)
        run: make container-up 2>&1 | tee reports/container-up.txt
      - name: make container-stop-check (SIGTERM -> exit 0)
        run: make container-stop-check
      - name: make container-lb-check (балансировка, отказ узла, rate limit)
        run: make container-lb-check
      - name: make container-persistence-check (пересоздание и обновление образа)
        env:
          CONTAINER_CHECK_FLAGS: "" # новая версия образа собирается внутри сценария
        run: make container-persistence-check
      - name: make container-restore-check (восстановление БД в новый volume)
        run: make container-restore-check
      - name: Журналы контейнеров
        if: always()
        run: docker compose logs --no-color > reports/compose.log 2>&1 || true
      - name: make container-down
        if: always()
        run: make container-down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-container
          path: reports/
          if-no-files-found: ignore

  publish:
    name: publish
    # п. 10: публикация только после успеха ВСЕХ обязательных проверок
    needs: [prepare, style, tests, migrations, backup, security, build, image-scan, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      GIT_SHA: ${{ needs.prepare.outputs.sha }}
      REGISTRY_USER: ${{ vars.LOCAL_REGISTRY_USER || 'ci' }}
      REGISTRY_PASSWORD: ${{ secrets.LOCAL_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: make registry-up (локальный docker hub с паролем)
        run: make registry-up
      - name: make image-publish (теги версии и commit SHA)
        run: make image-publish IMAGE="$IMAGE"
      - name: Вход в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Публикация в GHCR (только основная ветка)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          target="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/auctions-app"
          for tag in "${IMAGE##*:}" "sha-${GIT_SHA}"; do
            docker tag "$IMAGE" "$target:$tag"
            docker push "$target:$tag"
            echo "- \`$target:$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
