<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auction System</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
  <h1>Auction System</h1>
  <p>Учет аукционов, лотов, ставок и продаж</p>
</header>
<main>
  <section class="cards">
    <div><b id="auction-count">0</b><span>аукционов</span></div>
    <div><b id="lot-count">0</b><span>лотов</span></div>
    <div><b id="sale-count">0</b><span>продаж</span></div>
    <div><b id="revenue">0.00</b><span>выручка</span></div>
  </section>
  <section class="panel">
    <h2>Создать аукцион</h2>
    <form id="auction-form">
      <input name="name" placeholder="Название" required>
      <input name="start_at" type="datetime-local" required>
      <input name="end_at" type="datetime-local" required>
      <input name="description" placeholder="Описание">
      <button>Создать</button>
    </form>
  </section>
  <section class="panel"><h2>Аукционы</h2><div id="auctions"></div></section>

  <section class="panel">
    <h2>Продавцы и покупатели</h2>
    <form id="seller-form">
      <input name="name" placeholder="Имя продавца" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="phone" placeholder="Телефон">
      <button>Добавить продавца</button>
    </form>
    <form id="buyer-form">
      <input name="name" placeholder="Имя покупателя" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="phone" placeholder="Телефон">
      <button>Добавить покупателя</button>
    </form>
    <div class="two-col">
      <div><h3>Продавцы</h3><div id="sellers"></div></div>
      <div><h3>Покупатели</h3><div id="buyers"></div></div>
    </div>
  </section>

  <section class="panel">
    <h2>Добавить лот</h2>
    <p class="hint">Лот можно добавить только в аукцион со статусом PLANNED или ACTIVE.</p>
    <form id="lot-form">
      <select name="auction_id" required></select>
      <select name="seller_id" required></select>
      <input name="name" placeholder="Название лота" required>
      <input name="starting_price" type="number" step="0.01" min="0.01" placeholder="Стартовая цена" required>
      <input name="description" placeholder="Описание">
      <button>Добавить лот</button>
    </form>
  </section>
  <section class="panel"><h2>Лоты</h2><div id="lots"></div></section>
  <section class="panel"><h2>Продажи</h2><div id="sales"></div></section>
  <div id="message"></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
