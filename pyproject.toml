# Конфигурация инструментов проверки (Lab 3, п. 6, 7, 14).
# Менять пороги и исключения можно только с обоснованием в PR (CONTRIBUTING.md).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-report=html:reports/htmlcov",
    "--junitxml=reports/junit.xml",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Минимум покрытия кода. Снижать запрещено (проверяется scripts/check_policy.py).
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["reports"]

[tool.ruff.lint]
# E/F — ошибки и неиспользуемое, W — предупреждения стиля,
# B — типичные баги (bugbear).
select = ["E", "F", "W", "B"]
ignore = [
    "B008",  # Depends()/Cookie() в значениях по умолчанию — штатный паттерн FastAPI
    "E501",  # длину строк контролирует black; длинные строки-сообщения не переносятся
]

[tool.black]
target-version = ["py312"]
extend-exclude = "reports"
